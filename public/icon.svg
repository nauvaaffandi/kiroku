<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Modern finance tracker icon: minimalist ledger with trend line -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2b67ad"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <rect x="72" y="96" width="368" height="320" rx="20" fill="url(#grad)" stroke="#2563eb" stroke-width="8"/>
  <!-- Ledger lines -->
  <line x1="128" y1="160" x2="384" y2="160" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="224" x2="384" y2="224" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <line x1="128" y1="288" x2="384" y2="288" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <!-- Trend line (upward = growth) -->
  <polyline points="160,320 224,256 288,288 352,224 416,176" fill="none" stroke="#0d7a50" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Data points -->
  <circle cx="160" cy="320" r="10" fill="#0d7a50"/>
  <circle cx="224" cy="256" r="10" fill="#0d7a50"/>
  <circle cx="288" cy="288" r="10" fill="#0d7a50"/>
  <circle cx="352" cy="224" r="10" fill="#0d7a50"/>
  <circle cx="416" cy="176" r="10" fill="#0d7a50"/>
</svg>